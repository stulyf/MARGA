plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.marga.solver'
    compileSdk 34

    defaultConfig {
        applicationId "com.marga.solver"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    // Pack ONNX models without compression for faster loading
    aaptOptions {
        noCompress "onnx"
    }
}

dependencies {
    // ONNX Runtime for Android (CPU + GPU EP via NNAPI)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // JSON parsing for config
    implementation 'com.google.code.gson:gson:2.10.1'

    // OSMDroid for map visualization
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}
